name: Auger real wavefront test

on:
  pull_request:
    branches:
      - main
    paths:
      - research/auger_wavefront_test.py
      - .github/workflows/auger-wavefront-test.yml
  push:
    branches:
      - experiment/auger-wavefront-test
    paths:
      - research/auger_wavefront_test.py
      - .github/workflows/auger-wavefront-test.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  MPLBACKEND: Agg

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/auger-wavefront-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade numpy pandas scipy matplotlib requests
      - name: Run held-out wavefront comparison
        run: python research/auger_wavefront_test.py
      - name: Upload reproducible results
        uses: actions/upload-artifact@v4
        with:
          name: auger-wavefront-results
          path: results/
          if-no-files-found: error
          retention-days: 7
      - name: Commit result summary to experiment branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Record PAO110416 wavefront test results" || exit 0
          git push origin HEAD:experiment/auger-wavefront-test
